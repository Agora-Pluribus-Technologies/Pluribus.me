<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Subscription - AgoraPages</title>
  <link rel="icon" type="image/png" href="/assets/AgoraPages-globe.svg" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #181818;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 500px;
      padding: 40px 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    .status {
      margin-top: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 16px;
    }
    .status.success {
      background-color: #1b3a1b;
      border: 1px solid #4caf50;
      color: #4caf50;
    }
    .status.error {
      background-color: #3a1b1b;
      border: 1px solid #f44336;
      color: #f44336;
    }
    .status.loading {
      background-color: #1b2a3a;
      border: 1px solid #2196f3;
      color: #2196f3;
    }
    a {
      color: gold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .home-link {
      margin-top: 30px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Confirm Subscription</h1>
    <div id="status" class="status loading">Confirming your subscription...</div>
    <a href="https://agorapages.com" class="home-link">Back to AgoraPages</a>
  </div>

  <script>
    (async function () {
      const statusEl = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        statusEl.className = "status error";
        statusEl.textContent = "Invalid confirmation link. No token provided.";
        return;
      }

      try {
        const response = await fetch(`/api/subscribers?confirm=${encodeURIComponent(token)}`);
        const result = await response.json();

        if (response.ok && result.success) {
          statusEl.className = "status success";
          statusEl.textContent = result.message || "Your subscription is confirmed! You'll receive emails when new posts are published.";
        } else {
          statusEl.className = "status error";
          statusEl.textContent = result.message || "Failed to confirm. The link may have expired or already been used.";
        }
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = "An error occurred. Please try again later.";
      }
    })();
  </script>
</body>
</html>
